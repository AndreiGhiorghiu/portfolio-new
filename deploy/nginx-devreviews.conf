# /etc/nginx/sites-available/devreviews.online
# Primary domain: andrei-ghiorghiu.dev (serves the static Astro build)
# Legacy domain: devreviews.online (301 → andrei-ghiorghiu.dev)

server {
    server_name andrei-ghiorghiu.dev www.andrei-ghiorghiu.dev;

    root /var/www/portfolio;
    index index.html;

    # Astro emits directory-style URLs (…/page/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # hashed assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JSON visit log (format defined in conf.d/visits-log.conf)
    access_log /var/log/visits/visits.json visits_json if=$loggable_page;

    # private stats dashboard (basic auth)
    location = /stats/data.json {
        alias /var/log/visits/visits.json;
        default_type application/json;
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex" always;
    }

    location /stats/ {
        alias /var/www/stats/;
        index index.html;
        auth_basic "stats";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        add_header X-Robots-Tag "noindex" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/andrei-ghiorghiu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andrei-ghiorghiu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# legacy domain — permanent redirect to the new one
server {
    server_name devreviews.online www.devreviews.online;

    return 301 https://andrei-ghiorghiu.dev$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/devreviews.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devreviews.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP — everything to HTTPS on the new domain
server {
    listen 80;
    listen [::]:80;
    server_name andrei-ghiorghiu.dev www.andrei-ghiorghiu.dev devreviews.online www.devreviews.online;

    return 301 https://andrei-ghiorghiu.dev$request_uri;
}
