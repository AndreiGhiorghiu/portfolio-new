# /etc/nginx/sites-available/devreviews.online
# Static Astro build served from /var/www/portfolio
# (certbot rewrites this for HTTPS after `certbot --nginx`)

server {
    server_name devreviews.online www.devreviews.online;

    root /var/www/portfolio;
    index index.html;

    # Astro emits directory-style URLs (…/page/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # hashed assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # JSON visit log (format defined in conf.d/visits-log.conf)
    access_log /var/log/visits/visits.json visits_json if=$loggable_page;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devreviews.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devreviews.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.devreviews.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = devreviews.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name devreviews.online www.devreviews.online;
    return 404; # managed by Certbot




}