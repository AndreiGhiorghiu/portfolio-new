# /etc/nginx/sites-available/devreviews.online
# Static Astro build served from /var/www/portfolio
# (certbot rewrites this for HTTPS after `certbot --nginx`)

server {
    listen 80;
    listen [::]:80;
    server_name devreviews.online www.devreviews.online;

    root /var/www/portfolio;
    index index.html;

    # Astro emits directory-style URLs (…/page/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # hashed assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
