# /etc/nginx/conf.d/visits-log.conf
# JSON visit logging — one line per page view, assets excluded.

# log only real page navigations, not assets/fonts/images
map $request_uri $loggable_page {
    default 1;
    ~^/_astro/ 0;
    ~*\.(js|css|jpg|jpeg|png|webp|svg|ico|pdf|woff2?|txt|xml|json|map)$ 0;
}

log_format visits_json escape=json
    '{"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"}';
